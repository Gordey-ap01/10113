ServerName localhost
<Directory /var/www/html>
    AllowOverride All
    Options -Indexes
    Require all granted
</Directory>
<LocationMatch "^/(?:\.|deployment-manifest[.]json)">
    Require all denied
</LocationMatch>
<FilesMatch "(?i)^(?:wp-config[.]php|mail-config[.]php|.*[.](?:sql|gz|log|key|pem|local[.]md))$">
    Require all denied
</FilesMatch>
Header always set X-Robots-Tag "noindex, nofollow, noarchive"
# The original index.html stays byte-for-byte intact, including advertising tags.
AddOutputFilterByType SUBSTITUTE text/html
SubstituteMaxLineLength 10m
Substitute "s|</body>|<div role='note' style='padding:14px;text-align:center;font:14px Arial,sans-serif;background:#eef6fb;color:#17445d'>Локальная копия от 26.10.2026 &#183; Gordey_ap01</div></body>|ni"
